name: Deploy devlog

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-devlog.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer deploy replaces one still in progress, never a finished one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      # LFS is off on purpose: the site needs no game assets, and this saves LFS bandwidth.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check-links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # Only runs if the build and link check passed, so a failure leaves the last good site in place.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
